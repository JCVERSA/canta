name: Recon (Phase 0)

# Phase 0 reconnaissance harness. Runs on a GitHub-hosted runner because the
# development sandbox has restricted egress; every selector claim in
# RECONNAISSANCE.md is reproducible from this workflow's artifacts.
#
#   gh workflow run recon.yml
#   gh run download <run-id> -n recon-evidence -D recon-out

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/recon/**"
      - ".github/workflows/recon.yml"

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run reconnaissance harness
        run: node tools/recon/recon.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-evidence
          path: recon-out/**
          if-no-files-found: warn
          retention-days: 30
