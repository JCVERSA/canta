name: CI

# Mirrors SwiftSlate-ng's CI shape (JDK 17, gradle/actions, no local SDK setup)
# with the addition the task asks for: every push and pull request produces an
# installable **preview** APK whose applicationId is `com.jcversa.canta.preview`.
#
# On failure each job appends its Gradle output to `.ci-logs/` and pushes it back
# to the branch. That is deliberate: this repo is developed from environments
# (Termux, sandboxes, remote agents) where the Actions log blob storage is not
# reachable, so `gh run view --log` returns EOF. A committed log tail is the only
# build output those environments can read.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseG1GC"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # JDK 17 is what Canta compiles against (compileOptions/jvmTarget = 17).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish build log on failure
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci-logs
          { echo "job: unit-tests"; echo "sha: ${GITHUB_SHA}"; echo "date: $(date -u)"; echo; tail -c 60000 build.log 2>/dev/null || echo "(no build.log)"; } > .ci-logs/unit-tests.txt
          bash .github/scripts/publish-ci-log.sh

  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="debug-${GITHUB_SHA:0:7}" 2>&1 | tee build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canta-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish build log on failure
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci-logs
          { echo "job: debug-apk"; echo "sha: ${GITHUB_SHA}"; echo "date: $(date -u)"; echo; tail -c 60000 build.log 2>/dev/null || echo "(no build.log)"; } > .ci-logs/debug-apk.txt
          bash .github/scripts/publish-ci-log.sh

  preview-apk:
    name: Preview APK (com.jcversa.canta.preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build preview APK
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then LABEL="pr${PR_NUMBER}"; else LABEL="manual"; fi
          echo "APK_LABEL=$LABEL" >> "$GITHUB_ENV"
          ./gradlew assemblePreview --no-daemon --console=plain --stacktrace \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="${LABEL}-${GITHUB_SHA:0:7}" 2>&1 | tee build.log

      - name: Verify the preview applicationId
        if: success()
        shell: bash
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/preview/*.apk | head -n1)
          echo "built: $APK"
          # AAPT ships with the Android SDK image on ubuntu-latest. Dump the
          # package name so the preview applicationId is verified in CI rather
          # than asserted in a comment.
          if command -v aapt2 >/dev/null 2>&1; then
            aapt2 dump packagename "$APK"
          elif command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | head -n 1
          elif [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/aapt2" ]; then
            "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/aapt2" dump packagename "$APK"
          else
            echo "no aapt available - skipping package dump"
          fi
          mv "$APK" "app/build/outputs/apk/preview/Canta-${APK_LABEL}-${GITHUB_SHA:0:7}.apk"

      - name: Upload preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canta-preview
          path: app/build/outputs/apk/preview/Canta-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish build log on failure
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci-logs
          { echo "job: preview-apk"; echo "sha: ${GITHUB_SHA}"; echo "date: $(date -u)"; echo; tail -c 60000 build.log 2>/dev/null || echo "(no build.log)"; } > .ci-logs/preview-apk.txt
          bash .github/scripts/publish-ci-log.sh
