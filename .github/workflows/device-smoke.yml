name: Device smoke test

# Runtime verification, which the unit tests and the APK jobs cannot provide:
# they prove the app compiles, lints and passes pure-function tests, but nothing
# has ever *run* on Android. This job installs the debug APK on an emulator and
# checks the two things that only fail at runtime:
#
#   1. the app launches and MainActivity is the resumed activity (App.onCreate,
#      the theme, the container and the WorkManager configuration all ran);
#   2. nothing crashed in the process, including after a second launch that
#      carries the episode watcher's notification extras.
#
# It also captures real screenshots into screenshots/ and commits them, together
# with a report of what the run actually saw, because the README ships no
# mock-ups: an image in that directory has to come from a running build.
# Committing (rather than uploading artifacts) keeps both readable from
# restricted environments where artifact downloads and raw job logs are
# unreachable.
#
# Two distinctions the run has to make, learned from run 3 of this job:
#
#   * an ANR *in com.jcversa.canta* fails the run. The emulator's own system
#     processes (com.android.phone, com.android.providers.media.module) ANR on
#     software-rendered CI runners whatever is installed — run 3 logged nine of
#     them while Canta itself never ANR'd — so they are reported, not blamed on
#     the app. Blaming it would be a false finding.
#   * a screenshot is taken only when no system dialog covers the screen, and is
#     named for what it shows. A capture of a "Process system isn't responding"
#     dialog named after an app screen would be a claim the file cannot support.
#     For the same reason the catalogue capture is 01-app-amoled.png: on a runner
#     whose DNS cannot resolve the source site, the honest state of that screen is
#     its error message, not a grid of covers.

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      # The test script and the workflow are part of what this job verifies: a
      # change to either must re-run it. Leaving .github/scripts/** out meant a
      # rewritten script was never executed by CI (the same class of gap as a
      # test that is never run).
      - ".github/scripts/**"
      - ".github/workflows/device-smoke.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Emulator smoke test + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="smoke-${GITHUB_SHA:0:7}" 2>&1 | tee build.log

      # KVM is available on GitHub-hosted ubuntu runners, which is what makes an
      # x86_64 emulator usable here. API 34 is the interesting target: it is the
      # strictest foreground-service and notification-permission behaviour the
      # app claims to support (targetSdk 36).
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          # Runs 7-9 all show the emulator starving on the runner's default core
          # count: system_server "is not responding", systemui/phone/media/bluetooth
          # ANR'ing in a loop, and uiautomator/gfxinfo frequently unusable - that is
          # the context every ANR finding here has to be read in. `-cores 4` was
          # tried against it and withdrawn: the run immediately after it (run 10)
          # never booted the emulator at all, and the flag could not be verified
          # from this sandbox. An unproven change that makes a run fail earlier than
          # before is not an improvement; the starvation is reported, not papered
          # over.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The action runs this instead of the script directly, so that a device
          # that never booted still leaves a file behind to publish. Run 10 failed
          # exactly that way: no report, no smoke.log, and the action's own error
          # text unreachable from the sandbox - a red run nobody could diagnose.
          script: |
            {
              echo "device state as the smoke script was about to start:"
              adb devices
              echo "sys.boot_completed=$(adb shell getprop sys.boot_completed 2>&1 | tr -d '\r')"
              echo "ro.build.version.sdk=$(adb shell getprop ro.build.version.sdk 2>&1 | tr -d '\r')"
              echo
            } > smoke.log 2>&1
            # No pipelines and no PIPESTATUS here: it is not documented which shell
            # runs this block, and a `sh` without pipefail (or a wrapper with
            # `set -e`) would either lose the script's exit status or skip the copy
            # below entirely - in both cases a failing run could look green.
            set +e
            bash .github/scripts/device-smoke.sh > smoke-run.out 2>&1
            rc=$?
            tee -a smoke.log < smoke-run.out
            exit $rc

      - name: Upload screenshots
        if: always()
        # The artifact is a convenience: an intermediary 403 from the artifact
        # storage service (seen on run 35647992403) must not turn a green
        # build into a red branch. The failure is still visible in the log.
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: canta-screenshots
          path: |
            screenshots/*.png
            screenshots/smoke-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish the captures and the smoke report onto the branch
        # Only from a push: a pull request from a fork has a read-only token, and
        # the directory belongs to the branch that produced the build. The report
        # matters as much as the images: job logs and artifacts are unreachable
        # from the development sandbox, so a committed file is the only way the
        # run's timings, screen text and ANR findings can be read there.
        if: always() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain screenshots 2>/dev/null)" ]; then
            echo "screenshots unchanged - nothing to publish. Contents of the directory:"
            ls -la screenshots/ || true
            echo "(a run that reached the smoke script always rewrites smoke-report.txt, so"
            echo "an unchanged directory means the script never ran - look for smoke.log"
            echo "in the 'Publish logs on failure' step or the .ci-logs commit)"
            exit 0
          fi
          git config user.name "canta-smoke"
          git config user.email "smoke@jcversa.invalid"
          git add -f screenshots
          git commit -m "chore(screenshots): captures + smoke report from emulator run ${GITHUB_RUN_NUMBER} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "screenshots published"
              exit 0
            fi
            echo "push attempt ${attempt} rejected - rebasing"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 3))
          done
          echo "screenshot push failed after 3 attempts"

      - name: Publish logs on failure
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci-logs
          {
            echo "job: device-smoke"
            echo "sha: ${GITHUB_SHA}"
            echo "date: $(date -u)"
            echo
            echo "--- build.log tail ---"
            tail -c 20000 build.log 2>/dev/null || echo "(no build.log)"
            echo
            echo "--- emulator smoke log ---"
            if [ -s smoke.log ]; then
              tail -c 30000 smoke.log
            else
              echo "(no smoke.log: the emulator step did not get as far as the smoke script)"
            fi
          } > .ci-logs/device-smoke.txt
          {
            echo "job: device-smoke"
            grep -E "^(e: |FAILURE|\\* What went wrong)|FATAL EXCEPTION|::error::|smoke: FAIL" \
              build.log smoke.log 2>/dev/null | head -n 120
          } > .ci-logs/device-smoke-errors.txt
          bash .github/scripts/publish-ci-log.sh
